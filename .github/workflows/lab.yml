# Lab: one sample edit per treatment from the real atlas, nothing published. Results go to the "review" branch.
name: lab
on:
  workflow_dispatch:
    inputs:
      treatments:
        description: "comma list"
        default: "emblem,shrine,fluidicon,slime,attractor,monolith"
      seed:
        default: "4242"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        env:
          T: ${{ github.event.inputs.treatments }}
        run: echo "list=$(python3 -c "import json,os,re;print(json.dumps([t for t in os.environ['T'].split(',') if re.fullmatch('[a-z]+([.][a-z]+)?',t)]))")" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        treat: ${{ fromJson(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edits/requirements.txt
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q ffmpeg libegl1 libgl1-mesa-dri fonts-dejavu-core fonts-noto-core fonts-freefont-ttf >/dev/null && pip install -q -r edits/requirements.txt
      - name: render
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          TREAT: ${{ matrix.treat }}
          SEED: ${{ github.event.inputs.seed }}
        run: python edits/lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.treat }}
          path: edits/_work/lab/
          retention-days: 2
  publish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab-*
          path: lab
          merge-multiple: true
      - name: push to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd lab && git init -q -b review && git config user.name "atlas bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "lab: $(date -u '+%Y-%m-%d %H:%M')" && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" review
