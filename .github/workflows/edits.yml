# Nightly edits on free GitHub minutes: the batch is split across parallel runners (shards), then one merge job publishes to the atlas.
name: edits
on:
  workflow_dispatch:
    inputs:
      cap:
        description: "edits to make this run"
        default: "10"
      mode:
        description: "make | probe (only list the tracks it would pick)"
        default: "make"
permissions:
  contents: write
concurrency: edits
env:
  SHARDS: 5
jobs:
  probe:
    if: ${{ github.event.inputs.mode == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r edits/requirements.txt && python edits/montage.py --probe && cat edits/last-montage.md >> "$GITHUB_STEP_SUMMARY"
  render:
    if: ${{ github.event.inputs.mode != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edits/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            edits/_work/montage/els
            edits/_work/montage/img
          key: edits-lib-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: edits-lib-
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q ffmpeg libegl1 libgl1-mesa-dri fonts-dejavu-core >/dev/null && pip install -q -r edits/requirements.txt
      - name: render this shard
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          CAP: ${{ github.event.inputs.cap || '10' }}
          SHARD: ${{ matrix.shard }}
        run: '[[ "$CAP" =~ ^[0-9]{1,3}$ ]] && python edits/montage.py --cap "$CAP" --shard "$SHARD" --of "$SHARDS"'
      - uses: actions/upload-artifact@v4
        with:
          name: edits-${{ matrix.shard }}
          path: edits/_work/montage/out/
          retention-days: 1
          if-no-files-found: ignore
  merge:
    needs: render
    if: ${{ always() && github.event.inputs.mode != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edits/requirements.txt
      - run: pip install -q -r edits/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: edits-*
          path: shards
      - name: merge + publish
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
        run: python edits/montage.py --merge $(ls -d shards/*/ 2>/dev/null)
      - name: redeploy the atlas so the new edits go live
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: if [ -n "$DEPLOY_HOOK" ]; then curl -fsS -o /dev/null -X POST "$DEPLOY_HOOK" && echo "atlas build triggered"; else echo "no DEPLOY_HOOK secret"; fi
      - name: commit run report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cp edits/last-montage.md /tmp/report.md
          for i in 1 2 3 4 5; do
            git reset -q --hard && git fetch -q origin main && git checkout -q -B main origin/main
            cp /tmp/report.md edits/last-montage.md
            git add edits/last-montage.md
            if git diff --cached --quiet; then echo "no report change"; break; fi
            if git commit -q -m "edits: run report" && git push -q origin main; then echo "report pushed"; break; fi
            echo "push rejected, retrying ($i)"; sleep $((i*15))
          done
