# Lists the tracks the viral pool would pick right now (edits/last-probe.md). Runs alongside renders.
name: track probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r edits/requirements.txt && python edits/montage.py --probe
      - name: commit probe report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cp edits/last-montage.md edits/last-probe.md && git add edits/last-probe.md && git commit -q -m "probe: report" && git pull -q --rebase origin main && git push -q origin HEAD:main
